<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Health App – OPD List</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* --- EXACT CSS FROM HEALTH APP - HOME (7) --- */
:root{color-scheme:light;--brand:#123B90;--b2:#1169CA;--ink:#0f2a3a;--muted:#5f7788;--line:#e3ebf0;--bg:#f6f6f6;--card:#fff;--sos:#FA8072;--g1:#d6e6fa;--g2:#d3f5ea;--sh:0 12px 32px rgba(18,59,144,.10)}

*{box-sizing:border-box;margin:0;padding:0}
html,body{color:var(--ink);font-family:Manrope,system-ui,sans-serif;background:radial-gradient(110% 380px at 0% 0%,var(--g1),transparent 70%),radial-gradient(90% 320px at 100% 0%,var(--g2),transparent 70%),var(--bg);background-repeat:no-repeat;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;text-align:left}
:focus-visible{outline:3px solid var(--b2);outline-offset:2px}
.app{max-width:430px;margin:0 auto;min-height:100vh;padding:0 0 128px 0;position:relative}
.pad{padding:0 20px}
h2{font-family:Fraunces,Georgia,serif;font-size:23px;font-weight:700;letter-spacing:-.015em}

/* HEADER BASE */
.top{display:flex;align-items:center;gap:12px}
.av{width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,#123B90,#1169CA);color:#fff;display:grid;place-items:center;font-weight:800;font-size:20px;border:3px solid var(--card);box-shadow:var(--sh)}
.who{flex:1;min-width:0}.who small{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who b{font-family:Fraunces,Georgia,serif;font-size:24px;display:block;line-height:1.15;letter-spacing:-.01em}
.ib{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.75);backdrop-filter:blur(10px);border:1px solid var(--line);display:grid;place-items:center;position:relative;box-shadow:var(--sh)}
.ib i{position:absolute;top:12px;right:13px;width:9px;height:9px;border-radius:50%;background:var(--sos);border:2px solid #fff}
.search{margin-top:20px;display:flex;align-items:center;gap:10px;height:58px;padding:0 8px 0 20px;background:var(--card);border-radius:29px;box-shadow:var(--sh);color:var(--muted)}
.search input{flex:1;min-width:0;border:0;outline:0;background:none;font:inherit;font-size:15px;color:var(--ink)}
.search span{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#123B90,#1169CA);color:#fff;display:grid;place-items:center}

/* HEADER OVERRIDES */
.app{padding-top:0}
header.pad{position:relative;background:radial-gradient(circle at 92% 8%,rgba(255,255,255,.20) 0 70px,transparent 71px),radial-gradient(circle at 74% 100%,rgba(255,255,255,.10) 0 90px,transparent 91px),linear-gradient(150deg,#123B90 0%,#1169CA 100%);padding:calc(env(safe-area-inset-top,0px) + 18px) 20px 0;border-radius:0 0 34px 34px}
header.pad+.sec{margin-top:56px!important}
header .who small{color:rgba(255,255,255,.82)}header .who b{color:#fff}
header .av{background:rgba(255,255,255,.2);border:2px solid rgba(255,255,255,.65);box-shadow:none}
header .ib{background:rgba(255,255,255,.18);border:0;color:#fff;box-shadow:none;backdrop-filter:none}
header .ib i{border-color:#123B90;display:grid;place-items:center;width:17px;height:17px;top:7px;right:7px;font-size:9.5px;font-style:normal;font-weight:800;color:#fff;border:2px solid #123B90}
header .search{margin-top:22px;margin-bottom:-29px;position:relative;box-shadow:0 14px 30px rgba(8,50,80,.28)}
header .search:focus-within{box-shadow:0 0 0 4px rgba(255,255,255,.35),0 14px 30px rgba(8,50,80,.28)}
.search input{caret-color:#1169CA}
header .search:focus-within{box-shadow:0 0 0 4px rgba(254,230,45,.7),0 14px 30px rgba(18,59,144,.3)}

/* --- STICKY NAVBAR (Missing HTML reconstructed) --- */
.stick{position:fixed;top:0;left:50%;transform:translate(-50%,-115%);width:100%;max-width:430px;z-index:20;background:linear-gradient(150deg,#123B90,#1169CA);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 14px;display:flex;align-items:center;gap:10px;border-radius:0 0 24px 24px;box-shadow:0 12px 26px rgba(8,50,80,.28)}
.stick.show{transform:translate(-50%,0)}
.stick b{flex:1;font-family:Fraunces,Georgia,serif;font-size:18px}
.stick .sa{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.2);border:2px solid rgba(255,255,255,.6);display:grid;place-items:center;font-weight:800;font-size:14px}
.stick .sb{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center}
@media(prefers-reduced-motion:no-preference){.stick{transition:transform .35s cubic-bezier(.2,.7,.2,1)}}

/* --- BOTTOM NAVIGATION (Exact match to CSS rules) --- */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);width:calc(100% - 28px);max-width:402px;height:70px;background:rgba(255,255,255,.9);backdrop-filter:blur(16px);border-radius:35px;box-shadow:0 14px 36px rgba(18,59,144,.25);display:grid;grid-template-columns:1fr 1fr 80px 1fr 1fr;align-items:center;z-index:100}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--muted)}
.nav .on{color:var(--b2)}
.nav .sos{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,#fd9a8f,#FA8072);color:#fff;justify-self:center;margin-top:-30px;display:grid;place-items:center;align-content:center;box-shadow:0 12px 24px rgba(250,128,114,.5);border:4px solid var(--bg);font-size:10.5px;font-weight:800}
.nav button svg{transition:background .2s}
.nav button.on svg{box-sizing:border-box;width:38px;height:30px;padding:3px 7px;border-radius:15px;background:rgba(17,105,202,.14)}

/* SECTIONS */
.sec{margin-top:30px}
.sh{display:flex;justify-content:space-between;align-items:flex-end;padding:0 20px;margin-bottom:16px}
.sh p{font-size:12.5px;color:var(--muted);margin-top:3px}
.link{font-size:12.5px;font-weight:800;color:var(--b2);background:rgba(17,105,202,.10);padding:7px 13px;border-radius:999px}

/* --- OPD CARDS CSS --- */
.h-card {background: var(--card);border-radius: 28px;padding: 20px 18px;margin-bottom: 16px;box-shadow: var(--sh);animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;opacity: 0;transform: translateY(15px);border: 1px solid rgba(255,255,255,0.5);}
.h-head {display: flex;justify-content: space-between;align-items: flex-start;margin-bottom: 12px;}
.h-title {font-family: Fraunces, Georgia, serif;font-size: 19px;font-weight: 700;color: var(--ink);margin-bottom: 2px;line-height: 1.2;}
.h-type {font-size: 12.5px;color: var(--muted);font-weight: 600;}
.h-rating {background: #fef3c7;color: #d97706;padding: 6px 10px;border-radius: 12px;font-size: 13px;font-weight: 800;display: flex;align-items: center;gap: 4px;}
.h-tags {display: flex;gap: 8px;margin-bottom: 18px;flex-wrap: wrap;}
.h-tag {font-size: 11px;font-weight: 800;padding: 5px 10px;border-radius: 8px;display: flex;align-items: center;gap: 4px;text-transform: uppercase;letter-spacing: 0.5px;}
.h-tag.open { background: #e3f4e1; color: #3a8a35; }
.h-tag.closed { background: #feeceb; color: #e5484d; }
.h-tag.spec { background: #dcecfb; color: #1068A8; }
.h-info {display: grid;grid-template-columns: 1fr 1fr;gap: 12px;margin-bottom: 20px;padding-bottom: 20px;border-bottom: 1px solid var(--line);}
.h-info span {display: flex;align-items: center;gap: 8px;font-size: 13.5px;color: var(--muted);font-weight: 700;}
.h-info svg {color: var(--b2);width: 18px;height: 18px;}
.h-actions {display: grid;grid-template-columns: 1fr auto auto;gap: 10px;}
.h-btn-main {background: linear-gradient(135deg, #123B90, #1169CA);color: #fff;border-radius: 14px;font-weight: 800;font-size: 13.5px;display: flex;align-items: center;justify-content: center;gap: 8px;padding: 0 16px;height: 46px;transition: transform 0.15s;}
.h-btn-icon {width: 46px;height: 46px;background: #f0f5fa;color: var(--ink);border-radius: 14px;display: grid;place-items: center;transition: transform 0.15s;}
.h-btn-icon.call { background: #e0f7f4; color: #0e8f84; }
.h-btn-main:active, .h-btn-icon:active { transform: scale(0.96); }
@keyframes slideUp { to { opacity: 1; transform: translateY(0); } }
svg{display:block}
</style>
</head>
<body>
<div class="app">

  <!-- STICKY NAVBAR (Appears on Scroll) -->
  <div class="stick" id="stickyHeader">
    <div class="sa">J</div>
    <b>Hello, Javed</b>
    <div class="sb">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>
    </div>
  </div>

  <!-- MAIN HEADER -->
  <header class="pad">
    <div class="top">
      <div class="av" aria-hidden="true">J</div>
      <div class="who">
        <small>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>
          Badshah Nagar, Mahanagar
        </small>
        <b>Hello, Javed</b>
      </div>
      <button class="ib" aria-label="Notifications">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>
        <i>3</i>
      </button>
    </div>
    <label class="search">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input type="search" placeholder="Search hospitals, specialties..." aria-label="Search hospital">
      <span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
      </span>
    </label>
  </header>

  <!-- MAIN CONTENT -->
  <section class="sec" aria-label="OPD List">
    <div class="sh">
      <div>
        <h2>Nearby Hospitals</h2>
        <p>Sorted by distance</p>
      </div>
      <button class="link">Map View</button>
    </div>
    
    <div class="pad" id="hospital-list">
      <!-- Cards injected via JS -->
    </div>
  </section>

  <!-- BOTTOM NAVIGATION (Exact 5-column layout with SOS) -->
  <nav class="nav" aria-label="Main navigation">
    <button>
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      Home
    </button>
    <button class="on">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M6 21V8l6-4 6 4v13M10 21v-4h4v4"/></svg>
      Hospitals
    </button>
    <button class="sos">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom:2px"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
      SOS
    </button>
    <button>
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
      History
    </button>
    <button>
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>
      Profile
    </button>
  </nav>
</div>

<script>
  // --- SCROLL LOGIC FOR STICKY NAVBAR ---
  window.addEventListener('scroll', () => {
    const stick = document.getElementById('stickyHeader');
    // Show sticky header when scrolling down past the main header's height
    if (window.scrollY > 120) {
      stick.classList.add('show');
    } else {
      stick.classList.remove('show');
    }
  });

  // --- HOSPITAL DATA & RENDERING ---
  const hospitals = [
    { name: "True Hospital", type: "Multi-Specialty Hospital", distance: "513.52 KM", rating: "4.8", isOpen: true, specialty: "Cardiology", doctors: "24+ Doctors" },
    { name: "Uma Sanjeevani", type: "Super Specialty Clinic", distance: "514.44 KM", rating: "4.5", isOpen: true, specialty: "Orthopedics", doctors: "12+ Doctors" },
    { name: "Mayom Hospital", type: "General Hospital", distance: "515.66 KM", rating: "4.2", isOpen: false, specialty: "Neurology", doctors: "18+ Doctors" },
    { name: "Vinayak Hospital", type: "Eye Care Center", distance: "520.06 KM", rating: "4.9", isOpen: true, specialty: "Ophthalmology", doctors: "8+ Doctors" },
    { name: "Kathuria Hospital", type: "Maternity & Child Care", distance: "520.18 KM", rating: "4.6", isOpen: true, specialty: "Pediatrics", doctors: "15+ Doctors" },
    { name: "Aryan Hospital", type: "General Hospital", distance: "521.11 KM", rating: "4.4", isOpen: false, specialty: "Dermatology", doctors: "10+ Doctors" }
  ];

  const listContainer = document.getElementById('hospital-list');

  function createCard(h, index) {
    const statusClass = h.isOpen ? 'open' : 'closed';
    const statusText = h.isOpen ? 'OPEN NOW' : 'CLOSED';
    const statusIcon = h.isOpen ? 
      '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6 9 17l-5-5"/></svg>' : 
      '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M18 6 6 18M6 6l12 12"/></svg>';
    
    const delay = index * 0.1;

    return `
      <div class="h-card" style="animation-delay: ${delay}s">
        <div class="h-head">
          <div>
            <h3 class="h-title">${h.name}</h3>
            <div class="h-type">${h.type}</div>
          </div>
          <div class="h-rating">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 17.27 18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
            ${h.rating}
          </div>
        </div>
        <div class="h-tags">
          <span class="h-tag ${statusClass}">${statusIcon} ${statusText}</span>
          <span class="h-tag spec">${h.specialty}</span>
        </div>
        <div class="h-info">
          <span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>
            ${h.distance}
          </span>
          <span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            ${h.doctors}
          </span>
        </div>
        <div class="h-actions">
          <button class="h-btn-main">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg>
            Directions
          </button>
          <button class="h-btn-icon" aria-label="Save">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m19 21-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
          </button>
          <button class="h-btn-icon call" aria-label="Call">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
          </button>
        </div>
      </div>
    `;
  }

  let html = '';
  hospitals.forEach((h, i) => { html += createCard(h, i); });
  listContainer.innerHTML = html;
</script>
</body>
</html>
